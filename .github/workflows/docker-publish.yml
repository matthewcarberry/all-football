name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On every merge to main, pick the next version from the latest v* tag.
      # The merged PR's labels choose the bump: release:major, release:minor,
      # release:skip; otherwise a "feat:" title is minor, a "type!:" title is
      # major, and anything else is a patch. With no tags yet, package.json
      # supplies the first version.
      - id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already tagged; skipping release."
            exit 0
          fi

          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty' || true)
          labels=$(echo "$pr" | jq -r '[.labels[]?.name] | join(",")' 2>/dev/null || true)
          title=$(echo "$pr" | jq -r '.title // empty' 2>/dev/null || true)
          [ -n "$title" ] || title=$(git log -1 --format=%s)

          case ",$labels," in
            *,release:skip,*) echo "release:skip label set; skipping release."; exit 0 ;;
          esac

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=$(node -p "require('./package.json').version")
          else
            bump=patch
            if echo "$title" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then bump=major
            elif echo "$title" | grep -qE '^feat(\([^)]*\))?:'; then bump=minor
            fi
            case ",$labels," in
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
              *,release:patch,*) bump=patch ;;
            esac
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          echo "Releasing v$next (previous: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tags created with GITHUB_TOKEN don't start another workflow run, so the
      # versioned image above is the only build for this release.
      - name: Create GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
