services:
  world-cup-dashboard:
    build: .
    container_name: world-cup-dashboard
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      PORT: 8080
      CACHE_TTL_MS: 60000
      LIVE_CACHE_TTL_MS: 15000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
